
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Data Aspirasi — ASPIRASI</title>

<style>
:root {
  --bg: #0b1220;
  --panel: #111d30;
  --panel2: #17253b;
  --border: #263750;
  --text: #e8eef8;
  --muted: #91a2bb;
  --blue: #3984ff;
  --green: #22c58b;
  --yellow: #f5b942;
  --red: #f06b75;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  min-height: 70px;
  padding: 16px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { font-size: 19px; font-weight: bold; }
.brand span { color: var(--blue); }
header a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
}
main {
  max-width: 1150px;
  margin: auto;
  padding: 28px 18px;
}
h1 { margin: 0 0 8px; font-size: 25px; }
.subtitle { color: var(--muted); font-size: 14px; }
.toolbar {
  display: flex;
  gap: 10px;
  margin: 24px 0 16px;
  flex-wrap: wrap;
}
input, select {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 9px;
  outline: none;
  min-height: 43px;
}
input { flex: 1; min-width: 180px; }
select { min-width: 145px; }
button {
  background: var(--blue);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: bold;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
}
.panel-head {
  padding: 17px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}
.panel-head h2 { margin: 0; font-size: 16px; }
#resultCount { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}
th, td {
  padding: 14px 15px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
th { color: var(--muted); font-weight: normal; }
td { vertical-align: middle; }
.small { color: var(--muted); font-size: 11px; margin-top: 5px; }
.status {
  display: inline-block;
  padding: 6px 9px;
  border-radius: 20px;
  font-size: 11px;
  background: var(--panel2);
}
.status.Menunggu { color: var(--yellow); }
.status.Dibaca { color: #65b5ff; }
.status.Diproses { color: #bd9aff; }
.status.Selesai { color: var(--green); }
.view-btn { padding: 8px 12px; font-size: 12px; }
.empty {
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
}
.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 15px;
  color: var(--muted);
  font-size: 12px;
}
.pagination div { display: flex; gap: 8px; }
.pagination button { padding: 8px 12px; }
#message {
  margin: 15px 0;
  font-size: 13px;
  color: var(--muted);
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000b;
  z-index: 10;
  padding: 18px;
  overflow-y: auto;
}
.modal-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  max-width: 650px;
  margin: 35px auto;
  padding: 20px;
}
.modal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal-top h2 { font-size: 19px; }
.close {
  background: var(--panel2);
  padding: 8px 12px;
}
.detail-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.detail-label { color: var(--muted); font-size: 12px; }
.detail-value {
  margin-top: 7px;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
@media(max-width:600px) {
  main { padding: 22px 12px; }
  header { padding: 14px; }
  h1 { font-size: 22px; }
  .toolbar { flex-direction: column; }
  input, select { width: 100%; }
  .pagination { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

<body>

<header>
  <div class="brand">ASPIRASI <span>STUDENT VOICE</span></div>
  <a href="dashboard.html">← Kembali ke Dashboard</a>
</header>

<main>
  <h1>Data Aspirasi</h1>
  <div class="subtitle">Kelola dan pantau aspirasi yang dikirimkan oleh siswa.</div>

  <div class="toolbar">
    <input id="searchInput" type="search"
      placeholder="Cari judul, kode, atau nama pengirim...">

    <select id="statusFilter">
      <option value="">Semua Status</option>
      <option value="Menunggu">Menunggu</option>
      <option value="Dibaca">Dibaca</option>
      <option value="Diproses">Diproses</option>
      <option value="Selesai">Selesai</option>
    </select>

    <button id="refreshBtn" onclick="loadAspirations()">↻ Muat Ulang</button>
  </div>

  <div id="message">Menghubungkan ke server...</div>

  <section class="panel">
    <div class="panel-head">
      <h2>Daftar Aspirasi</h2>
      <span id="resultCount">0 data</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Judul Aspirasi</th>
            <th>Kategori</th>
            <th>Pengirim</th>
            <th>Status</th>
            <th>Tanggal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="aspirationList">
          <tr><td colspan="6" class="empty">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span id="pageInfo">Halaman 1</span>
      <div>
        <button id="prevBtn" onclick="changePage(-1)" disabled>Sebelumnya</button>
        <button id="nextBtn" onclick="changePage(1)" disabled>Berikutnya</button>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="detailModal">
  <div class="modal-box">
    <div class="modal-top">
      <h2>Detail Aspirasi</h2>
      <button class="close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent">Memuat detail...</div>
  </div>
</div>

<script>
const API_URL = "https://aspirasi-siswa-api.dikaandiyansyah328.workers.dev";

const token = sessionStorage.getItem("aspirasi_admin_token");

let aspirations = [];
let currentPage = 1;
let totalPages = 1;
let loading = false;

if (!token) {
  window.location.href = "index.html";
}

function setMessage(text, error = false) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.color = error ? "#f06b75" : "#91a2bb";
}

async function apiFetch(path) {
  const response = await fetch(API_URL + path, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await response.json();

  if (response.status === 401 || response.status === 403) {
    sessionStorage.removeItem("aspirasi_admin_token");
    window.location.href = "index.html";
    throw new Error("Sesi admin berakhir. Silakan login kembali.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.message || "Permintaan gagal.");
  }

  return data;
}

async function loadAspirations() {
  if (loading) return;
  loading = true;

  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.disabled = true;
  setMessage("Mengambil data aspirasi dari server...");

  try {
    const params = new URLSearchParams({
      page: currentPage,
      limit: 50
    });

    const data = await apiFetch(
      "/api/admin/aspirations?" + params.toString()
    );

    aspirations = Array.isArray(data.aspirations)
      ? data.aspirations
      : [];

    totalPages = Math.max(
      1,
      Number(data.pagination?.total_pages || 1)
    );

    renderAspirations();

    setMessage("Data berhasil dimuat dari database.");
  } catch (error) {
    setMessage(error.message, true);
    document.getElementById("aspirationList").innerHTML =
      '<tr><td colspan="6" class="empty">Gagal memuat data aspirasi.</td></tr>';
  } finally {
    loading = false;
    refreshBtn.disabled = false;
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "-";

  const date = new Date(
    String(value).includes("Z") || String(value).includes("+")
      ? value
      : String(value).replace(" ", "T") + "Z"
  );

  if (Number.isNaN(date.getTime())) return value;

  return date.toLocaleString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function renderAspirations() {
  const keyword = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const selectedStatus = document.getElementById("statusFilter").value;

  const filtered = aspirations.filter(item => {
    const searchable = [
      item.title,
      item.tracking_code,
      item.category,
      item.sender_name
    ].join(" ").toLowerCase();

    const matchKeyword = searchable.includes(keyword);
    const matchStatus = !selectedStatus || item.status === selectedStatus;

    return matchKeyword && matchStatus;
  });

  document.getElementById("resultCount").textContent =
    filtered.length + " data ditampilkan";

  const tbody = document.getElementById("aspirationList");

  if (!filtered.length) {
    tbody.innerHTML =
      '<tr><td colspan="6" class="empty">Tidak ada aspirasi yang cocok.</td></tr>';
  } else {
    tbody.innerHTML = filtered.map(item => `
      <tr>
        <td>
          <strong>${escapeHTML(item.title)}</strong>
          <div class="small">Kode: ${escapeHTML(item.tracking_code)}</div>
        </td>
        <td>${escapeHTML(item.category)}</td>
        <td>${item.is_anonymous
          ? "Anonim"
          : escapeHTML(item.sender_name || "Tidak disebutkan")}</td>
        <td>
          <span class="status ${escapeHTML(item.status)}">
            ${escapeHTML(item.status)}
          </span>
        </td>
        <td>${escapeHTML(formatDate(item.created_at))}</td>
        <td>
          <button class="view-btn"
            onclick="showDetail(${Number(item.id)})">
            Lihat
          </button>
        </td>
      </tr>
    `).join("");
  }

  document.getElementById("pageInfo").textContent =
    "Halaman " + currentPage + " dari " + totalPages;

  document.getElementById("prevBtn").disabled = currentPage <= 1;
  document.getElementById("nextBtn").disabled = currentPage >= totalPages;
}

function changePage(direction) {
  const next = currentPage + direction;

  if (next < 1 || next > totalPages) return;

  currentPage = next;
  loadAspirations();
}

async function showDetail(id) {
  const modal = document.getElementById("detailModal");
  const content = document.getElementById("detailContent");

  modal.style.display = "block";
  content.textContent = "Mengambil detail aspirasi...";

  try {
    const data = await apiFetch("/api/admin/aspirations/" + id);
    const item = data.aspiration || data;

    const messages = Array.isArray(item.messages)
      ? item.messages
      : [];

    content.innerHTML = `
      <div class="detail-item">
        <div class="detail-label">Judul Aspirasi</div>
        <div class="detail-value">${escapeHTML(item.title)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Kode Pelacakan</div>
        <div class="detail-value">${escapeHTML(item.tracking_code)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Kategori</div>
        <div class="detail-value">${escapeHTML(item.category)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Pengirim</div>
        <div class="detail-value">${
          item.is_anonymous
            ? "Anonim"
            : escapeHTML(item.sender_name || "Tidak disebutkan")
        }</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Status</div>
        <div class="detail-value">${escapeHTML(item.status)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Isi Aspirasi</div>
        <div class="detail-value">${escapeHTML(item.content)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Tanggal Pengiriman</div>
        <div class="detail-value">${escapeHTML(formatDate(item.created_at))}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Balasan Admin (${messages.length})</div>
        <div class="detail-value">${
          messages.length
            ? messages.map(message =>
                escapeHTML(message.message) +
                " (" + escapeHTML(message.visibility) + ")"
              ).join("\\n\\n")
            : "Belum ada balasan."
        }</div>
      </div>
    `;
  } catch (error) {
    content.textContent = error.message;
  }
}

function closeDetail() {
  document.getElementById("detailModal").style.display = "none";
}

document.getElementById("searchInput")
  .addEventListener("input", renderAspirations);

document.getElementById("statusFilter")
  .addEventListener("change", renderAspirations);

document.getElementById("detailModal")
  .addEventListener("click", function(event) {
    if (event.target === this) closeDetail();
  });

loadAspirations();
</script>

</body>
</html>
